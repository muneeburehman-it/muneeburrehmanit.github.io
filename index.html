        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #e5e7eb;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        /* Navigation */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 17, 32, 0.95);
            border-bottom: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Hero */

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.16), transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.12), transparent 30%);
        }

        .hero-content {
            max-width: 800px;
        }

        .tag {
            display: inline-block;
            padding: 7px 14px;
            border: 1px solid #1e88b7;
            border-radius: 30px;
            color: #38bdf8;
            font-size: 13px;
            margin-bottom: 20px;
            background: rgba(56, 189, 248, 0.06);
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 72px);
            line-height: 1.05;
            margin-bottom: 18px;
            color: #f8fafc;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero h2 {
            font-size: 24px;
            font-weight: normal;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            color: #cbd5e1;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid #334155;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-secondary {
            background: transparent;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Sections */

        section {
            padding: 90px 0;
            border-bottom: 1px solid #172033;
        }

        .section-title {
            margin-bottom: 45px;
        }

        .section-title span {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .section-title h2 {
            font-size: 36px;
            color: #f8fafc;
            margin-top: 8px;
        }

        .section-title p {
            color: #94a3b8;
            margin-top: 8px;
        }

        /* About */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .about-card {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 12px;
        }

        .about-card p {
            color: #cbd5e1;
            margin-bottom: 18px;
        }

        /* Skills */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .skill {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 18px;
            border-radius: 10px;
            color: #cbd5e1;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-3px);
            border-color: #0284c7;
        }

        .skill strong {
            color: #38bdf8;
        }

        /* Projects */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .project {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 30px;
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-5px);
            border-color: #0284c7;
        }

        .project-number {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
        }

        .project h3 {
            color: #f8fafc;
            margin: 10px 0 15px;
            font-size: 21px;
        }

        .project p {
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .project ul {
            padding-left: 20px;
            color: #cbd5e1;

</html>
